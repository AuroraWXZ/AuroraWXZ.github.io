baseURL = "https://aurorawxz.github.io/"
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true
languageCode = "en"
# Choose one of emacs, trac or perldoc
pygmentsStyle = "catppuccin-mocha"
theme = "gokarna"
title = "Xinzhi"

[params]
  avatarAltText = "avatar"
  avatarSize = "size-xl"
  avatarURL = "/images/avatar.webp"
  accentColor = "#FF4D4D"
  customCSS = ["css/custom.css"]


  customHeadHTML = """
    <link rel="stylesheet" href="/css/custom.css">

    <!-- KaTeX -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"
          integrity="sha384-5TcZemv2l/9On385z///+d7MSYlvIEw9FuZTIdZ14vJLqWphw7e7ZPuOiCHJcFCP"
          crossorigin="anonymous">

    <script defer
            src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"
            integrity="sha384-cMkvdD8LoxVzGF/RPUKAcvmm49FQ0oxwDF3BGKtDXcEc+T1b2N+teh/OJfpU0jr6"
            crossorigin="anonymous"></script>

    <script defer
            src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"
            integrity="sha384-hCXGrW6PitJEwbkoStFjeJxv+fSOOQKOPbJxSfM6G5sWZjAyWhXiTIIAmQqnlLlh"
            crossorigin="anonymous"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (typeof renderMathInElement !== "undefined") {
          renderMathInElement(document.body, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ],
            throwOnError: false
          });
        }
      });

      function openLightbox(src) {
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        if (lightbox && lightboxImg) {
          lightboxImg.src = src;
          lightbox.style.display = "flex";
          document.body.style.overflow = "hidden";
        }
      }

      function closeLightbox() {
        const lightbox = document.getElementById("lightbox");
        if (lightbox) {
          lightbox.style.display = "none";
          document.body.style.overflow = "";
        }
      }
    </script>
  """

  customFooterHTML = """
      <div class="globe-wrap">
        <script
          type="text/javascript"
          id="clstr_globe"
          src="https://clustrmaps.com/globe.js?d=I3-sTDwGkGnW02XDmXmqkLt52swcF7TEvjTntKJpaec">
        </script>
      </div>
    """

  description = "Ph.D Student • LLM & Databases"
  footer = "Xinzhi Wang"
  metaKeywords = ["blog", "Xinzhi", "hugo"]
  showBackToTopButton = true # true or false for "back to top" button on posts and pages

  socialIcons = [
    {name = "email", url = "mailto:wang6171@purdue.edu"},
    {name = "linkedin", url = "https://www.linkedin.com/in/xinzhi-wang-ab01b3191/"},
    {name = "google", url = "https://scholar.google.com/citations?user=YTrIWCoAAAAJ&hl=en"}
  ]

