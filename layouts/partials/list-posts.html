{{ $page := . }}
<div class="post-entry">
  <div class="post-title-row">
    {{ with $page.Params.badge }}
      <span class="conf-badge {{ $page.Params.badgeClass }}">{{ . }}</span>
    {{ end }}

    <a href="{{ $page.Permalink }}" class="post-link">
      <span class="publication-title">{{ $page.Title }}</span>
    </a>
  </div>

  {{ with $page.Description }}
    <div class="publication-description">
      {{ . | markdownify }}
    </div>
  {{ end }}
</div>
